# Builds the gallery from the pose masters and fixtures of the AnkiQuest-Server
# commit the `server` submodule pins, and deploys it to GitHub Pages. Pull
# requests only test and build. Dependabot opens the submodule bumps.
name: pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # Node and cwebp come from the dev shell (AnkiQuest-Dev's gallery shell).
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check
      # mermaid-cli and the Chromium Puppeteer downloads, for the test that
      # renders wiring.mmd.
      - run: nix develop -c npm ci
      - run: nix develop -c npm test
      - run: nix develop -c node src/build.ts server _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
