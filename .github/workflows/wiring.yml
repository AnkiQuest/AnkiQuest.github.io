# Regenerates wiring.json (the wiring page's data) from every AnkiQuest
# repository's default branch, daily, on demand and on the `wiring-changed`
# repository_dispatch, with its Mermaid form
# (wiring.mmd, rendered to wiring.svg and wiring-dark.svg), and opens or updates
# one pull request (branch wiring-update) when anything but the
# timestamp changed. Merging it deploys the page through `pages`.
#
# Reads public repositories only. Private ones (AnkiQuest-Hosting,
# float3/nixos) are never read: the generator declares their links to
# AnkiQuest repositories and shows nothing else of them.
# GITHUB_TOKEN is sent to the GitHub API for its higher rate limit.
#
# AnkiQuest-Sync's wiring job sends `wiring-changed` when a repository or
# package the map reads has moved since the last build, and its agents and
# art jobs send it after changing pull requests.
#
# FORK_SYNC_TOKEN (AnkiQuest-Sync's token; Contents and Pull requests write
# here) pushes the branch and opens the pull request, so its CI runs. Without
# it the job falls back to GITHUB_TOKEN, whose pull requests start no CI.
name: wiring

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [wiring-changed]

permissions:
  contents: read

# Latest wins: a newer run replaces a running one, since only the newest map
# matters. A cancelled run leaves at most a commit on wiring-update, which the
# next run builds on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Generate wiring.json
        env:
          WIRING_GITHUB_TOKEN: ${{ github.token }}
        run: nix develop -c node src/wiring.ts wiring.json

      # Install scripts (Puppeteer's Chromium download) run without the token.
      - name: Write and render wiring.mmd
        env:
          GH_TOKEN: ""
        run: |
          nix develop -c npm ci
          nix develop -c node src/wiring-mermaid.ts

      # Only a change besides `generated` is worth a pull request.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          SYNC_TOKEN_SET: ${{ secrets.FORK_SYNC_TOKEN != '' }}
        run: |
          if [ "$(git show HEAD:wiring.json | jq -S 'del(.generated)')" = "$(jq -S 'del(.generated)' wiring.json)" ]; then
            echo "wiring.json unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SYNC_TOKEN_SET" != true ]; then
            echo "::warning::FORK_SYNC_TOKEN is not available here; the pull request is opened with GITHUB_TOKEN and starts no CI."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          # Add a commit to the open branch, or start it from master; never force-push.
          files=(wiring.json wiring.mmd wiring.svg wiring-dark.svg)
          for file in "${files[@]}"; do cp "$file" "$RUNNER_TEMP/$file"; done
          if git fetch -q origin wiring-update 2>/dev/null; then
            git checkout -q -B wiring-update FETCH_HEAD
            git merge -q --no-edit -X ours "$GITHUB_SHA"
          else
            git checkout -q -B wiring-update
          fi
          for file in "${files[@]}"; do cp "$RUNNER_TEMP/$file" "$file"; done
          git add "${files[@]}"
          # A run cancelled after its push leaves the branch without a pull
          # request; the next run still opens one.
          if git diff --cached --quiet; then
            echo "wiring-update already has this map" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "Update the wiring map" -m "Generated by the wiring workflow from every repository's default branch."
            git push -q origin wiring-update
          fi
          open=$(gh pr list --head wiring-update --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Updated pull request #$open" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create --head wiring-update --base master --title "Update the wiring map" \
            --body "Regenerated wiring.json and wiring.mmd by the wiring workflow. Review the out-of-date list on the page after merging.

          Opened by the wiring workflow."
