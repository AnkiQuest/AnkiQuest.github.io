# Builds the gallery from the art matrix (`xtask art-coverage --json`) of
# the AnkiQuest-Server commit the `server` submodule pins and the pictures
# and manifest of the AnkiQuest-Art commit the `art` submodule pins, and
# deploys it to GitHub Pages. Pull requests only test and build.
# Dependabot opens the submodule bumps.
name: pages

# Docs-only changes to this repository skip the run: the build reads src/,
# site/, the wiring files and the submodules (whose READMEs and licences reach
# the site through a submodule bump, which is not a docs path), never this
# repository's own Markdown or licence. Plain path filters suffice, since
# nothing here is a required check or runs in a merge queue.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - "LICENSES/**"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - "LICENSES/**"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a newer push replaces the older run. Deployments (push and
# manual runs): one at a time and never cancelled; a newer one waits, and
# GitHub drops a superseded waiting one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # Node and cwebp come from the dev shell (AnkiQuest-Dev's gallery shell).
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check
      # mermaid-cli and the Chromium Puppeteer downloads, for the test that
      # renders wiring.mmd.
      - run: nix develop -c npm ci
      - run: nix develop -c npm test

      # The art matrix, from the pinned Server's xtask. A Server without
      # art-coverage --json (before AnkiQuest-Server#118) fails the build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Read the art matrix
        working-directory: server
        run: |
          if ! cargo run -q -p ankiquest-xtask -- art-coverage --json > "$RUNNER_TEMP/coverage.json"; then
            echo "::error::The pinned AnkiQuest-Server has no 'xtask art-coverage --json' (AnkiQuest-Server#118). Bump the server submodule to a commit that has it."
            exit 1
          fi

      - run: nix develop -c node src/build.ts server art _site "$RUNNER_TEMP/coverage.json"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
