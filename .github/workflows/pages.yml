# Builds the gallery from the art matrix the site derives itself
# (src/matrix.ts) from AnkiQuest-Server master's fixtures and the
# AnkiQuest-Art release ankiquest-art.json pins (staged by
# src/art-release.ts, which downloads and hash-checks the assets), and
# deploys it to GitHub Pages. Pull requests only test and build. A daily
# run picks up server changes; AnkiQuest-Sync bumps the Art pin.
name: pages

# Docs-only changes to this repository skip the run: the build reads src/,
# site/, the wiring files, server master and the Art pin, never this
# repository's own Markdown or licence. Plain path filters suffice, since
# nothing here is a required check or runs in a merge queue.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - "LICENSES/**"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - "LICENSES/**"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  # Server master's fixtures change without a push here.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a newer push replaces the older run. Deployments (push and
# manual runs): one at a time and never cancelled; a newer one waits, and
# GitHub drops a superseded waiting one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fixtures the matrix and the tests read, from server master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnkiQuest/AnkiQuest-Server
          ref: master
          path: server
          persist-credentials: false
          sparse-checkout: tests/fixtures
      # Node and cwebp come from the dev shell (AnkiQuest-Dev's gallery shell).
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check
      # mermaid-cli and the Chromium Puppeteer downloads, for the test that
      # renders wiring.mmd.
      - run: nix develop -c npm ci
      - run: nix develop -c npm test

      - run: nix develop -c node src/art-release.ts ankiquest-art.json .art
      - run: nix develop -c node src/build.ts server .art _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
