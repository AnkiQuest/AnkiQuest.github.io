version: 2
updates:
  # The server submodule: a bump brings new pose masters into the gallery.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily

  # flake.lock: AnkiQuest-Dev, which pins the dev shell.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
