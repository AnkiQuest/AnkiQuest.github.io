# Builds the gallery from AnkiQuest-Server's pose masters and fixtures and
# deploys it to GitHub Pages. Pull requests only test and build.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, to pick up new masters from AnkiQuest-Server.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnkiQuest/AnkiQuest-Server
          ref: master
          path: server
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install cwebp for the previews
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends webp
      - run: npm test
      - run: node src/build.ts server _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
