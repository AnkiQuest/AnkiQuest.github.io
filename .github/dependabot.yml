version: 2
updates:
  # flake.lock: AnkiQuest-Dev, which pins the dev shell. The AnkiQuest-Art
  # pin moves through AnkiQuest-Sync, not Dependabot.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
